name: OpenAPI snapshot

on:
  push:
    branches: [main, master]
    paths:
      - "backend/app/**"
      - "backend/scripts/export_openapi.py"
      - ".github/workflows/openapi.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/scripts/export_openapi.py"
      - "docs/api/openapi.json"
      - ".github/workflows/openapi.yml"

permissions:
  contents: write

jobs:
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Export OpenAPI
        run: python scripts/export_openapi.py

      - name: Check snapshot is up to date (PR)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if ! git diff --quiet -- docs/api/openapi.json; then
            echo "docs/api/openapi.json is outdated. Run: make openapi"
            git --no-pager diff -- docs/api/openapi.json
            exit 1
          fi

      - name: Commit updated snapshot (push to default branch)
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- docs/api/openapi.json; then
            echo "OpenAPI snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "docs: refresh OpenAPI snapshot"
          git push
